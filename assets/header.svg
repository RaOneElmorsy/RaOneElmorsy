<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#17112e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F5AF0"/>
      <stop offset="1" stop-color="#2CB67D"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .trace { fill: none; stroke: #2CB67D; stroke-width: 1.6; opacity: .28; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { animation: rise .8s ease-out backwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      .node { animation: glow 2.4s ease-in-out infinite; }
      @keyframes glow { 50% { fill: #2a1f5c; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)"/>

    <!-- circuit traces with travelling signals (IoT) -->
    <path id="t1" class="trace" d="M0 40 H140 L170 70 H330"/>
    <path id="t2" class="trace" d="M0 246 H90 L106 234 H300 L312 246 H520"/>
    <path id="t3" class="trace" d="M1000 30 H900 L870 60 H700"/>
    <circle cx="330" cy="70" r="4" fill="#2CB67D" opacity=".6"/>
    <circle cx="520" cy="246" r="4" fill="#2CB67D" opacity=".6"/>
    <circle cx="700" cy="60" r="4" fill="#2CB67D" opacity=".6"/>
    <circle r="3.5" fill="#2CB67D"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
    <circle r="3.5" fill="#7F5AF0"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
    <circle r="3.5" fill="#2CB67D"><animateMotion dur="3.6s" begin="1s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>

    <!-- text -->
    <text x="60" y="108" class="mono rise" font-size="18" fill="#2CB67D">~/rawan $ ./hello --world</text>
    <text x="56" y="168" class="sans rise" style="animation-delay:.3s" font-size="58" font-weight="800" fill="url(#name)">Rawan Elmorsy<tspan class="cursor" fill="#2CB67D">_</tspan></text>
    <text x="60" y="206" class="mono rise" style="animation-delay:.6s" font-size="17" fill="#c9c9e0">AI &amp; Machine Learning · IoT &amp; Embedded · .NET</text>

    <!-- small neural network (machine learning) -->
    <g stroke="#7F5AF0" stroke-width="1.2" opacity=".35">
      <line x1="780" y1="95" x2="850" y2="78"/>
      <line x1="780" y1="95" x2="850" y2="116"/>
      <line x1="780" y1="95" x2="850" y2="154"/>
      <line x1="780" y1="95" x2="850" y2="192"/>
      <line x1="780" y1="135" x2="850" y2="78"/>
      <line x1="780" y1="135" x2="850" y2="116"/>
      <line x1="780" y1="135" x2="850" y2="154"/>
      <line x1="780" y1="135" x2="850" y2="192"/>
      <line x1="780" y1="175" x2="850" y2="78"/>
      <line x1="780" y1="175" x2="850" y2="116"/>
      <line x1="780" y1="175" x2="850" y2="154"/>
      <line x1="780" y1="175" x2="850" y2="192"/>
      <line x1="850" y1="78" x2="920" y2="116"/>
      <line x1="850" y1="78" x2="920" y2="154"/>
      <line x1="850" y1="116" x2="920" y2="116"/>
      <line x1="850" y1="116" x2="920" y2="154"/>
      <line x1="850" y1="154" x2="920" y2="116"/>
      <line x1="850" y1="154" x2="920" y2="154"/>
      <line x1="850" y1="192" x2="920" y2="116"/>
      <line x1="850" y1="192" x2="920" y2="154"/>
    </g>
    <circle r="3.5" fill="#2CB67D"><animateMotion path="M780 95 L850 116 L920 154" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#2CB67D"><animateMotion path="M780 175 L850 154 L920 116" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#2CB67D"><animateMotion path="M780 135 L850 78 L920 116" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="95" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:0.0s"/>
    <circle cx="780" cy="135" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:0.2s"/>
    <circle cx="780" cy="175" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:0.4s"/>
    <circle cx="850" cy="78" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:0.6s"/>
    <circle cx="850" cy="116" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:0.8s"/>
    <circle cx="850" cy="154" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:1.0s"/>
    <circle cx="850" cy="192" r="9" fill="#0b0f1a" stroke="#7F5AF0" stroke-width="2.5" class="node" style="animation-delay:1.2s"/>
    <circle cx="920" cy="116" r="9" fill="#0b0f1a" stroke="#2CB67D" stroke-width="2.5" class="node" style="animation-delay:1.4s"/>
    <circle cx="920" cy="154" r="9" fill="#0b0f1a" stroke="#2CB67D" stroke-width="2.5" class="node" style="animation-delay:1.6s"/>
  </g>
</svg>
